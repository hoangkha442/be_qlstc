services:
  - type: web
    name: hoang-kha-learning-api
    runtime: node
    plan: free
    buildCommand: yarn install --frozen-lockfile --production=false && yarn build
    startCommand: yarn start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: '1'
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RECEIPT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: MAIL_PROVIDER
        value: brevo
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: BREVO_API_KEY
        sync: false
